server:
  port: 0

spring:
  application:
    name: fullstack-application
  datasource:
    url: "jdbc:h2:mem:testdb"
    username: sa
    password:
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  security:
    user:
      name: admin
      password: password

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

